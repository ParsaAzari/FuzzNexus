worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format waf_log '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" waf_rule="$sent_http_x_waf_rule" waf_action=$sent_http_x_waf_action';

    access_log /var/log/nginx/access.log waf_log;

    # Rate limiting zone: 25 requests/sec per IP with burst 10
    limit_req_zone $binary_remote_addr zone=waf_rate:10m rate=25r/s;
    limit_req_status 429;

    # Upstream to mock-target
    upstream backend_target {
        server mock-target:9090;
        keepalive 32;
    }

    # Common WAF server configuration block
    server {
        listen 80;
        listen 443 ssl http2;
        server_name localhost;

        ssl_certificate /etc/nginx/server.crt;
        ssl_certificate_key /etc/nginx/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 10m;

        # WAF Rule 1: Static signature block for known bots/fuzzers
        if ($http_user_agent ~* "(Fuzz Faster U Fool|sqlmap|gobuster|nikto|python-requests|dirb|nmap)") {
            return 403 '{"waf_status": "BLOCKED", "rule": "BOT_SIGNATURE_KNOWN_SCANNER"}';
        }

        # WAF Rule 2: Block empty User-Agent
        if ($http_user_agent = "") {
            return 403 '{"waf_status": "BLOCKED", "rule": "EMPTY_USER_AGENT"}';
        }

        # WAF Rule 3: Method restriction (Block OPTIONS)
        if ($request_method = OPTIONS) {
            return 403 '{"waf_status": "BLOCKED", "rule": "DISALLOWED_METHOD_OPTIONS"}';
        }

        # Artificial 502 Bad Gateway endpoint for Circuit Breaker 5xx testing
        location /artificial-502 {
            default_type application/json;
            return 502 '{"waf_status": "ERROR_502", "message": "Bad Gateway from Upstream"}';
        }

        # Body Inspection Scenario 1: AWS ALB Style (8KB inspection limit)
        location /waf-alb/ {
            proxy_pass http://backend_target/api/v1/process-body;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-WAF-Inspection-Limit "8192" always;
        }

        # Body Inspection Scenario 2: CloudFront Style (16KB inspection limit)
        location /waf-cloudfront/ {
            proxy_pass http://backend_target/api/v1/process-body;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-WAF-Inspection-Limit "16384" always;
        }

        # Body Inspection Scenario 3: Chunked Transfer Encoding
        location /waf-chunked/ {
            proxy_pass http://backend_target/api/v1/process-body;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header X-WAF-Chunked-Support "ENABLED" always;
        }

        # Dedicated endpoint without rate limiting for pure tc netem degradation tests
        location /api/v1/health-unlimited {
            proxy_pass http://backend_target/api/v1/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            add_header X-WAF-Action "PASSED" always;
        }

        location / {
            # Active per-IP rate limiting
            limit_req zone=waf_rate burst=10 nodelay;

            proxy_pass http://backend_target;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header X-WAF-Action "PASSED" always;
            add_header X-WAF-Rule "NONE" always;
        }

        error_page 429 = @rate_limited;
        location @rate_limited {
            add_header X-WAF-Action "RATE_LIMITED_429" always;
            add_header X-WAF-Rule "RATE_EXCEEDED" always;
            add_header Retry-After 1 always;
            default_type application/json;
            return 429 '{"waf_status": "RATE_LIMITED", "error": "Too Many Requests", "retry_after": 1}';
        }
    }
}
