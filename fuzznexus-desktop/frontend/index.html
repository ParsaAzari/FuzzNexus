<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta http-equiv="Content-Security-Policy" content="%CSP_DIRECTIVE%"/>
    <title>FuzzNexus</title>
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo-dark.svg" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/logo-light.svg" media="(prefers-color-scheme: light)" />
    <script>
        (function() {
            try {
                var mode = localStorage.getItem('fuzznexus-theme-mode') || 'system';
                var palette = localStorage.getItem('fuzznexus-theme-palette') || 'neutral';
                var isDark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                document.documentElement.setAttribute('data-theme', palette);
                document.documentElement.setAttribute('data-mode', isDark ? 'dark' : 'light');
            } catch (e) {}
        })();
    </script>
</head>
<body class="select-none">
<div id="app"></div>
<script src="./src/main.ts" type="module"></script>
</body>
</html>
