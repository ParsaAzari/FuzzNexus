    <path d="M 222 396 C 214 550, 304 676, 434 676 C 526 676, 580 598, 638 558 C 686 525, 722 538, 732 562 L 742 364 C 678 308, 582 284, 518 299 C 436 318, 402 436, 338 476 C 284 510, 240 450, 222 396 Z" fill="url(#smDarkWave)" />
