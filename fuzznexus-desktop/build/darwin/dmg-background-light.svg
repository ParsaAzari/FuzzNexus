<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 840" width="1320" height="840">
  <defs>
    <!-- Background Gradient: Clean Apple Light Aesthetic -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Arrow Linear Gradient: Sky Blue to Royal Blue to Indigo -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Refined Flow Arrow Glow & Soft Shadow -->
    <filter id="arrowSoftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2563EB" flood-opacity="0.30" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>

    <!-- Soft Ambient Halo behind the icons (anchor without borders or text collision) -->
    <radialGradient id="haloSource" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="haloTarget" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 1. Background Surface -->
  <rect width="1320" height="840" fill="url(#bgGrad)" />

  <!-- 2. Subtle Inset Border for Mac Window Frame -->
  <rect x="1" y="1" width="1318" height="838" rx="20" fill="none" stroke="rgba(15, 23, 42, 0.07)" stroke-width="2" />

  <!-- 3. Soft Ambient Halos under Icon Placements (Left: X=350, Right: X=970, Y=420) -->
  <circle cx="350" cy="420" r="145" fill="url(#haloSource)" />
  <circle cx="970" cy="420" r="145" fill="url(#haloTarget)" />

  <!-- 4. Top Header Section (Enlarged Typography, 100% Centered at X=660) -->
  <!-- Line 1: Title "FuzzNexus" (58px) + Version Pill Badge (50px height, 18px font) -->
  <!-- Width: Text ~280px + Gap 24px + Pill ~210px = 514px total. Centered at X=660 -->
  <g id="header-row1" transform="translate(660, 100)">
    <!-- Title: Centered text element offset to the left -->
    <text x="-125" y="14" text-anchor="middle" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="58" font-weight="800" letter-spacing="-1.2">
      FuzzNexus
    </text>

    <!-- Version Pill: Positioned to the right of title -->
    <g transform="translate(35, -24)">
      <rect x="0" y="0" width="215" height="48" rx="24" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2" />
      <text x="107.5" y="31" text-anchor="middle" fill="#1D4ED8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="18" font-weight="700" letter-spacing="0.4">
        v1.0.0 • MIT Licensed
      </text>
    </g>
  </g>

  <!-- Line 2: Subtitle (Enlarged to 26px, High Contrast & Maximum Legibility, Centered at X=660) -->
  <g id="header-row2" transform="translate(660, 180)">
    <text x="0" y="0" text-anchor="middle" fill="#334155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="26" font-weight="600" letter-spacing="-0.4">
      Drag <tspan fill="#0284C7" font-weight="700">FuzzNexus</tspan> into your <tspan fill="#2563EB" font-weight="700">Applications</tspan> folder to install
    </text>
  </g>

  <!-- 5. Center Directional Installation Element (Doubled in Size: 168x168) -->
  <!-- Centered at X=660, Y=420. Pure arrow icon with striking gradient and rich depth -->
  <g id="center-arrow" transform="translate(660, 420)">
    <!-- User's exact custom SVG arrow, scaled 2x to 168x168 (translate -84, -84) -->
    <g transform="translate(-84, -84)" filter="url(#arrowSoftShadow)">
      <svg width="168" height="168" viewBox="0 0 64 64">
        <path d="M58.545 30.355c-1.073-.983-4.937-3.788-7.043-5.063-1.416-.858-3.895-2.474-5.21-3.492-1.77-1.37-4.947-3.264-6.429-.499-.202.378-.11 1.22.61 1.995.943 1.016 8.59 5.654 10.309 7.205-1.83-.221-9.81-.332-14.355-.388-1.509-.018-5.6-.028-7.006.542-1.57.638-2.749 4.225.521 4.114 2.77-.094 6.027-.235 8.91-.235 3.575 0 8.05.18 11.708.013-1.873.9-4.379 2.716-5.575 3.74-1.104.947-2.406 2.413-2.295 4.241.08 1.314 2.383 2.55 4.267.5 2.92-3.177 6.042-5.044 8.153-6.356 1.309-.812 2.622-1.706 3.653-2.9 1.07-1.241.882-2.409-.218-3.417m-41.505.486c-1.355-.994-3.287-.392-4.002 1.323-.417 1.002-.632 2.185-.499 3.326.167 1.42 1.142 1.889 2.384 1.718 1.607-.222 2.66-2.273 2.9-4.058.138-1.013.043-1.703-.783-2.309m-7.66 1.711c-.443-1.385-1.995-1.884-3.27-.831-1.58 1.306-2.176 3.53-.867 5.323.814 1.116 2.39.743 3.234-.16 1.124-1.205 1.386-2.823.903-4.332m14.244-1.94c-2.161 0-2.833 2.095-2.81 3.81.006.454.113.918.377 1.287 1.003 1.402 2.48.713 3.542.169 1.202-.616 1.245-2.103 1.06-3.18-.284-1.642-1.282-2.086-2.169-2.086" fill="url(#arrowGrad)" />
      </svg>
    </g>
  </g>

  <!-- 6. Bottom Attribution Footer -->
  <g id="footer" transform="translate(660, 770)">
    <text x="0" y="0" text-anchor="middle" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="14" font-weight="600">
      Developed by <tspan fill="#0F172A" font-weight="700">Parsa Azari</tspan> • <tspan fill="#0284C7" font-weight="700">parsaazari.com</tspan>
    </text>
    <text x="0" y="24" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="500">
      Open Source Edition • MIT Licensed
    </text>
  </g>
</svg>
