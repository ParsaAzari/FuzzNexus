<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 800" width="1320" height="800">
  <defs>
    <!-- Background Gradient: Deep Obsidian Titanium to Midnight Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="50%" stop-color="#11151f" />
      <stop offset="100%" stop-color="#080a0e" />
    </linearGradient>

    <!-- Subtle Radial Vignette -->
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#182030" stop-opacity="0.6" />
      <stop offset="60%" stop-color="#0e121a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#050608" stop-opacity="0.95" />
    </radialGradient>

    <!-- High-End Cyber Beam Gradient (Cyan -> Sapphire -> Violet) -->
    <linearGradient id="beamGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Arrow Glow Filter -->
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow for Text -->
    <filter id="textShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <!-- Grid Pattern for subtle technical precision -->
    <pattern id="subtleGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- 1. Background Fill -->
  <rect width="1320" height="800" fill="url(#bgGrad)" />
  <rect width="1320" height="800" fill="url(#subtleGrid)" />
  <rect width="1320" height="800" fill="url(#vignette)" />

  <!-- 2. Outer Border Accent -->
  <rect x="1" y="1" width="1318" height="798" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" rx="16" />

  <!-- 3. Header Section (Top) -->
  <g id="header" filter="url(#textShadow)">
    <!-- Brand Title -->
    <text x="660" y="105" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="34" font-weight="800" letter-spacing="0.5">
      FuzzNexus
    </text>

    <!-- Version Pill -->
    <rect x="795" y="80" width="75" height="24" rx="12" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.35)" stroke-width="1" />
    <text x="832.5" y="96" text-anchor="middle" fill="#00F0FF" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', monospace" font-size="12" font-weight="700" letter-spacing="0.5">
      v1.0.0
    </text>

    <!-- Instruction Subtitle -->
    <text x="660" y="145" text-anchor="middle" fill="#8E9BAE" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="16" font-weight="500" letter-spacing="0.2">
      Drag and drop <tspan fill="#E2E8F0" font-weight="600">FuzzNexus</tspan> into the <tspan fill="#E2E8F0" font-weight="600">Applications</tspan> folder to install
    </text>
  </g>

  <!-- 4. Landing Target Guides (Subtle Pedestals at 2x coords: Left=350, Right=970, Y=380) -->
  <!-- Left Pedestal (App Icon) -->
  <g transform="translate(350, 380)">
    <ellipse cx="0" cy="120" rx="110" ry="22" fill="rgba(0, 240, 255, 0.06)" />
    <rect x="-95" y="-95" width="190" height="190" rx="44" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1.5" />
  </g>

  <!-- Right Pedestal (Applications Target) -->
  <g transform="translate(970, 380)">
    <ellipse cx="0" cy="120" rx="110" ry="22" fill="rgba(168, 85, 247, 0.06)" />
    <rect x="-95" y="-95" width="190" height="190" rx="44" fill="rgba(255, 255, 255, 0.02)" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1.5" />
  </g>

  <!-- 5. Minimal High-Tech Connecting Flow Arrow -->
  <g id="connecting-flow" filter="url(#glow)">
    <!-- Center Guide Flow Line -->
    <path d="M 485 380 L 835 380" fill="none" stroke="url(#beamGrad)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 8" opacity="0.85" />

    <!-- Outer Glow Line -->
    <path d="M 510 380 L 810 380" fill="none" stroke="url(#beamGrad)" stroke-width="1.5" opacity="0.95" />

    <!-- Pulse Signal Points -->
    <circle cx="520" cy="380" r="5" fill="#00F0FF" />
    <circle cx="660" cy="380" r="6" fill="#3B82F6" />
    <circle cx="800" cy="380" r="5" fill="#A855F7" />

    <!-- Sleek Arrow Head -->
    <path d="M 822 364 L 845 380 L 822 396" fill="none" stroke="#A855F7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Action Label inside Flow -->
  <g transform="translate(660, 420)">
    <rect x="-65" y="-14" width="130" height="28" rx="14" fill="rgba(17, 24, 39, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
    <text x="0" y="4" text-anchor="middle" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" letter-spacing="0.6">
      INSTALL
    </text>
  </g>

  <!-- 6. Bottom Status / Branding Bar -->
  <g id="footer" transform="translate(660, 725)">
    <text x="0" y="0" text-anchor="middle" fill="#64748B" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="13" font-weight="500" letter-spacing="0.2">
      Developed by <tspan fill="#CBD5E1" font-weight="600">Parsa Azari</tspan> • <tspan fill="#38BDF8">parsaazari.com</tspan>
    </text>
    <text x="0" y="24" text-anchor="middle" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11" font-weight="500">
      Open Source Edition • MIT Licensed
    </text>
  </g>
</svg>
