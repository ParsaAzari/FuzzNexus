    <path d="M 471 343 C 425 348, 405 386, 400 438 C 394 494, 384 530, 362 552 C 352 562, 356 579, 374 580 C 398 581, 414 559, 430 555 C 423 536, 423 496, 429 442 C 434 393, 449 356, 471 343 Z" fill="url(#darkGhostShadow)" />
