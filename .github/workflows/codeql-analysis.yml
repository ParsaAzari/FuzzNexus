name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 9 * * 3'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ['go']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - run: git checkout HEAD^2
        if: ${{ github.event_name == 'pull_request' }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            fuzznexus-desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fuzznexus-desktop/frontend/package-lock.json

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config
          sudo apt-get install -y libwebkit2gtk-4.1-dev || \
            sudo apt-get install -y libwebkit2gtk-4.0-dev
          if pkg-config --exists webkit2gtk-4.1 && ! pkg-config --exists webkit2gtk-4.0; then
            webkit_pc="$(pkg-config --variable=pc_path pkg-config | tr ':' '\n' | while read -r pc_dir; do
              if [ -f "$pc_dir/webkit2gtk-4.1.pc" ]; then
                printf '%s/webkit2gtk-4.1.pc' "$pc_dir"
                break
              fi
            done)"
            if [ -n "$webkit_pc" ]; then
              sudo cp "$webkit_pc" "$(dirname "$webkit_pc")/webkit2gtk-4.0.pc"
            fi
          fi

      - name: Build desktop frontend assets
        working-directory: fuzznexus-desktop/frontend
        run: |
          npm ci
          npm run build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Build both Go modules
        run: |
          go build ./...
          (cd fuzznexus-desktop && go build ./...)

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
