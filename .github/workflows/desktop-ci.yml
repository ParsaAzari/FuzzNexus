name: Desktop CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: |
            go.sum
            fuzznexus-desktop/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: fuzznexus-desktop/frontend/package-lock.json

      - name: Set up UCRT64 GCC for race detector (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Add UCRT64 to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}/ucrt64/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config
          sudo apt-get install -y libwebkit2gtk-4.1-dev || \
            sudo apt-get install -y libwebkit2gtk-4.0-dev

      - name: Add WebKitGTK pkg-config compatibility
        if: runner.os == 'Linux'
        run: |
          if pkg-config --exists webkit2gtk-4.1 && ! pkg-config --exists webkit2gtk-4.0; then
            webkit_pc="$(pkg-config --variable=pc_path pkg-config | tr ':' '\n' | while read -r pc_dir; do
              if [ -f "$pc_dir/webkit2gtk-4.1.pc" ]; then
                printf '%s/webkit2gtk-4.1.pc' "$pc_dir"
                break
              fi
            done)"
            if [ -z "$webkit_pc" ]; then
              echo "Could not locate webkit2gtk-4.1.pc"
              exit 1
            fi
            sudo cp "$webkit_pc" "$(dirname "$webkit_pc")/webkit2gtk-4.0.pc"
            echo "Added Wails compatibility alias for webkit2gtk-4.0"
          fi

      - name: Core Engine Tests
        shell: bash
        timeout-minutes: 10
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=5m ./pkg/...

      - name: Install Frontend Dependencies
        working-directory: fuzznexus-desktop/frontend
        shell: bash
        run: npm ci

      - name: Check Frontend (Typecheck, Test & Build)
        working-directory: fuzznexus-desktop/frontend
        shell: bash
        run: |
          npm run check
          npm test
          npm run build

      - name: Verify Production CSP Artifact
        shell: bash
        run: |
          if grep -q "%CSP_DIRECTIVE%" fuzznexus-desktop/frontend/dist/index.html; then
            echo "Error: %CSP_DIRECTIVE% placeholder remaining in build!"
            exit 1
          fi
          if grep -q "ws://" fuzznexus-desktop/frontend/dist/index.html; then
            echo "Error: ws:// found in production CSP!"
            exit 1
          fi
          echo "Production CSP verified cleanly."

      - name: Desktop Go Vet
        working-directory: fuzznexus-desktop
        shell: bash
        timeout-minutes: 5
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Desktop Go Tests
        working-directory: fuzznexus-desktop
        shell: bash
        timeout-minutes: 10
        env:
          CGO_ENABLED: "1"
          CI: "true"
        run: |
          set -o pipefail
          LOG_FILE="${RUNNER_TEMP:-/tmp}/desktop-test.log"
          status=0
          go test -race -count=1 -timeout=5m ./... 2>&1 | tee "$LOG_FILE" || status=$?
          if [ "$status" -ne 0 ]; then
            grep -nE -A 12 "^(--- FAIL:|panic:|WARNING: DATA RACE)" "$LOG_FILE" | head -n 40 | while IFS= read -r line; do
              echo "::error title=Desktop Go Test Failure::$line"
            done
          fi
          exit "$status"

      - name: Upload Desktop Test Log on Failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-log-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-test.log
          if-no-files-found: ignore

      - name: Install Wails CLI
        shell: bash
        timeout-minutes: 5
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1

      - name: Build Wails Desktop Application
        working-directory: fuzznexus-desktop
        shell: bash
        timeout-minutes: 10
        run: wails build

      - name: Verify Built Desktop Binary
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)
              test -d fuzznexus-desktop/build/bin/FuzzNexus.app || { echo "Missing FuzzNexus.app"; exit 1; }
              ;;
            Windows)
              test -f fuzznexus-desktop/build/bin/FuzzNexus.exe || { echo "Missing FuzzNexus.exe"; exit 1; }
              ;;
            Linux)
              test -f fuzznexus-desktop/build/bin/FuzzNexus || { echo "Missing FuzzNexus binary"; exit 1; }
              ;;
          esac
          echo "Desktop binary verified for ${{ runner.os }}."

      - name: Upload Desktop Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: fuzznexus-desktop-macos
          path: fuzznexus-desktop/build/bin/FuzzNexus.app
          if-no-files-found: error

      - name: Upload Desktop Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: fuzznexus-desktop-windows
          path: fuzznexus-desktop/build/bin/FuzzNexus.exe
          if-no-files-found: error

      - name: Upload Desktop Artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: fuzznexus-desktop-linux
          path: fuzznexus-desktop/build/bin/FuzzNexus
          if-no-files-found: error
