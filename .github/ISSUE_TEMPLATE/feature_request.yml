name: Feature request
description: Suggest a capability or improvement for FuzzNexus
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please check the [README](https://github.com/ParsaAzari/FuzzNexus#readme) and [Architecture Guide](https://github.com/ParsaAzari/FuzzNexus/blob/main/docs/ARCHITECTURE.md) first to see if FuzzNexus already supports your workflow.
  - type: dropdown
    id: area
    attributes:
      label: Target Area
      options:
        - Shared Engine & CLI
        - Desktop UI / UX
        - Wordlist & Filter Management
        - Build / Packaging / CI
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the security assessment or reconnaissance workflow and what currently falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the flag, UI control, output format, or engine behavior you would like FuzzNexus to support.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing flags, desktop presets, or workarounds you tried and their limitations.
    validations:
      required: false
