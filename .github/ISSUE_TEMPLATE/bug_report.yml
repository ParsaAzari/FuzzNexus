name: Bug report
description: Report a bug in FuzzNexus (CLI or Desktop)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing an issue, please review the [README](https://github.com/ParsaAzari/FuzzNexus#readme) and [Architecture Guide](https://github.com/ParsaAzari/FuzzNexus/blob/main/docs/ARCHITECTURE.md).

        Found a security vulnerability in FuzzNexus itself? Do not file a public issue. Report it privately through our [Security Policy](https://github.com/ParsaAzari/FuzzNexus/blob/main/SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which FuzzNexus interface are you using?
      options:
        - FuzzNexus Desktop (macOS / Windows / Linux)
        - FuzzNexus CLI
        - Both / Shared Engine
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FuzzNexus version
      description: Output of `fuzznexus -V` for CLI, or the desktop app version shown in About (if built from source, include the commit hash).
      placeholder: "e.g. v1.0.0"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command line or scan configuration
      description: The exact CLI command or desktop scan settings used. Redact any sensitive URLs, tokens, or credentials.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include relevant logs or error output. Paste text rather than screenshots where possible.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Go version
      description: Your OS/architecture, and `go version` if built from source.
      placeholder: "e.g. macOS 15 arm64 / Ubuntu 24.04 x86_64, go1.26"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Config file contents, wordlist characteristics, or target response behavior that helps reproduce the issue.
    validations:
      required: false
